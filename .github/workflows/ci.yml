name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref_name != github.event.repository.default_branch }}

jobs:
  test:
    uses: veraison/ci/.github/workflows/go-test.yml@main
    with:
      check-tests: false # we intentionally exclude some parts
      install-protoc: true
      setup: |
        .github/actions/install-nvat-dev/install.sh
      os: '["ubuntu-latest", "ubuntu-24.04-arm"]'
      test-command: |
        make build
        make -w test CI_PIPELINE=true
  cover:
    uses: veraison/ci/.github/workflows/go-cover.yml@main
    with:
      go-version: '1.27'
      install-protoc: true
      check-tests: false # we intentionally exclude some parts
      setup: |
        .github/actions/install-nvat-dev/install.sh
      cover-command: 'make coverage CI_PIPELINE=true'
      check-coverage: false # already done by the command itself

# Generated by veraison/ci from https://raw.githubusercontent.com/veraison/ci/main/configs/.golangci.yml
# and optional .golangci.project.yml.
# Do NOT EDIT: change .golangci.project.yml and regenerate with
#   https://raw.githubusercontent.com/veraison/ci/main/scripts/sync-config.py
version: '2'
linters:
  default: standard
  enable:
  - dupl
  - goconst
  - gocritic
  - gocyclo
  - gosec
  - lll
  - misspell
  - prealloc
  - unconvert
  settings:
    dupl:
      threshold: 100
    goconst:
      min-len: 2
      min-occurrences: 3
      ignore-string-values:
      - error
      - kv_key
      - https
    gocritic:
      enabled-tags:
      - diagnostic
      - experimental
      - opinionated
      - performance
      - style
      disabled-checks:
      - dupImport
      - hugeParam
      - ifElseChain
      - octalLiteral
      - paramTypeCombine
      - whyNoLint
      - wrapperFunc
    lll:
      line-length: 140
  exclusions:
    presets:
    - common-false-positives
    - std-error-handling
    - comments
    - legacy
    rules:
    - path: _test\.go
      linters:
      - dupl
      - goconst
      - gosec
      - lll
    generated: lax
    paths:
    - third_party$
    - builtin$
    - examples$
formatters:
  enable:
  - goimports
  exclusions:
    generated: lax
    paths:
    - third_party$
    - builtin$
    - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
